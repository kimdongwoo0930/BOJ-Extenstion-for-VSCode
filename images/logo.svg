<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 그라데이션 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 배경 원형 -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)"/>

  <!-- 왼쪽 브래킷 { -->
  <path d="M 38 35 Q 32 35 32 41 L 32 54 Q 32 58 28 60 Q 32 62 32 66 L 32 79 Q 32 85 38 85"
        stroke="#FFFFFF" stroke-width="5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 오른쪽 브래킷 } -->
  <path d="M 90 35 Q 96 35 96 41 L 96 54 Q 96 58 100 60 Q 96 62 96 66 L 96 79 Q 96 85 90 85"
        stroke="#FFFFFF" stroke-width="5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- BOJ 텍스트 -->
  <text x="64" y="70"
        font-family="'Arial Black', 'Arial Bold', sans-serif"
        font-size="28"
        font-weight="900"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="2">BOJ</text>

  <!-- 작은 체크마크 (성공 표시) -->
  <circle cx="100" cy="28" r="14" fill="url(#grad2)"/>
  <path d="M 93 28 L 97 32 L 107 22"
        stroke="#FFFFFF" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
